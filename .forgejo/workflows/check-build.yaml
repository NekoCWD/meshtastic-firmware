name: Test build
run-name: Test build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    uses: ./.forgejo/workflows/build.yaml
    with:
      target: ${{ matrix.variant.name }}
    name: Build for ${{ matrix.variant.pretty }}
    runs-on: docker
    strategy:
      matrix:
        variant:
          # NRF thing
          - pretty: NRF52 Pro-micro DIY TCX
            name: nrf52_promicro_diy_tcxo
            firmware: firmware.uf2
          # ESP32 thing
          - pretty: Heltec V3
            name: heltec-v3
            firmware: firmware.bin
